# Railway service config for Medusa backend.
# In Railway UI: set Root Directory to `apps/backend`.

[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm --filter=@dtc/backend build"

[deploy]
startCommand = "cd ../.. && pnpm --filter=@dtc/backend start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[environments.production.variables]
NODE_ENV = "production"
