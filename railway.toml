# Railway service config for Medusa backend.
# Prefer Dockerfile so admin UI assets from `medusa build` are kept in the image.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"

[deploy]
startCommand = "pnpm --filter=@dtc/backend exec medusa db:migrate && pnpm --filter=@dtc/backend start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
